<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>招聘数据可视化分析平台 - 薪资热力图</title>

    <!-- Custom fonts for this template-->
    <link href="/static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <!-- 使用本地Nunito字体替代在线加载 -->
    <link href="/static/css/nunito.css" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/static/css/sb-admin-2.min.css" rel="stylesheet">
    
    <!-- 先加载jQuery，避免echarts和map.js中的一些问题 -->
    <script src="/static/vendor/jquery/jquery.min.js"></script>
    
    <!-- ECharts和地图脚本，确保先加载echarts再加载地图 -->
    <script src="/static/js/echarts.min.js"></script>
    <script src="/static/js/term-echarts.js?v=1"></script>
    <!-- 不再使用内置地图数据，改为使用GeoJSON数据 -->
    <!-- <script src="/static/js/china.js"></script> -->

    <style>
        .filter-form {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fc;
            border-radius: 5px;
        }
        .filter-group {
            margin-bottom: 15px;
        }
        .filter-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .filter-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d3e2;
            border-radius: 4px;
        }
        .filter-btn {
            margin-top: 25px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .filter-btn-group {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .filter-btn-primary {
            background-color: #4e73df;
            color: white;
            border: none;
            min-width: 100px;
        }
        .filter-btn-secondary {
            background-color: #858796;
            color: white;
            border: none;
            min-width: 80px;
        }
        .filter-btn-success {
            background-color: #1cc88a;
            color: white;
            border: none;
            min-width: 100px;
        }
        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .rank-table {
            width: 100%;
        }
        .rank-table th, .rank-table td {
            padding: 10px;
            text-align: left;
        }
        .rank-table th {
            background-color: #f8f9fc;
            border-bottom: 2px solid #e3e6f0;
        }
        .rank-table tr:nth-child(even) {
            background-color: #f8f9fc;
        }
        .rank-table tr:hover {
            background-color: #eaecf4;
        }
        /* 添加地图加载状态样式 */
        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #4e73df;
            z-index: 100;
        }
        .map-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #e74a3b;
            z-index: 100;
            display: none;
        }
    </style>
    <link href="/static/css/terminal.css?v=2" rel="stylesheet">
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        {% include 'sidebar.html' %}

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Search -->
                    <form
                        class="d-none d-sm-inline-block form-inline mr-auto ml-md-3 my-2 my-md-0 mw-100 navbar-search">
                    </form>

                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small">管理员</span>
                            <img class="img-profile rounded-circle"
                                src="/static/img/tx.jpg">
                        </a>
                        <!-- Dropdown - User Information -->
                        <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                            aria-labelledby="userDropdown">
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                                <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                                注销
                            </a>
                        </div>
                    </li>

                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">薪资热力图</h1>
                    </div>

                    <!-- 过滤器行 -->
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="card shadow mb-4">
                                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h6 class="m-0 font-weight-bold text-primary">筛选条件</h6>
                                </div>
                                <div class="card-body">
                                    <form id="filterForm" class="filter-form">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <div class="filter-group">
                                                    <label class="filter-label">职位类别</label>
                                                    <select id="jobCategory" class="filter-select">
                                                        <option value="">全部</option>
                                                        <option value="java">Java</option>
                                                        <option value="python">Python</option>
                                                        <option value="c">C/C++</option>
                                                        <option value="c23">C#/.net</option>
                                                        <option value="u3due">Unity3D/UE</option>
                                                        <option value="php">PHP</option>
                                                        <option value="web">web前端</option>
                                                        <option value="ios">IOS</option>
                                                        <option value="android">Android</option>
                                                        <option value="algorithm">算法工程师</option>
                                                        <option value="test">测试工程师</option>
                                                        <option value="oam">运维工程师</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="filter-group">
                                                    <label class="filter-label">学历要求</label>
                                                    <select id="education" class="filter-select">
                                                        <option value="">不限</option>
                                                        <option value="博士">博士</option>
                                                        <option value="硕士">硕士</option>
                                                        <option value="本科">本科</option>
                                                        <option value="大专">大专</option>
                                                        <option value="高中">高中</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="filter-group">
                                                    <label class="filter-label">经验要求</label>
                                                    <select id="experience" class="filter-select">
                                                        <option value="">不限</option>
                                                        <option value="在校/应届">在校/应届</option>
                                                        <option value="经验不限">经验不限</option>
                                                        <option value="1-3年">1-3年</option>
                                                        <option value="3-5年">3-5年</option>
                                                        <option value="5-10年">5-10年</option>
                                                        <option value="10年以上">10年以上</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="filter-group">
                                                    <label class="filter-label">公司规模</label>
                                                    <select id="scale" class="filter-select">
                                                        <option value="">不限</option>
                                                        <option value="少于50人">少于50人</option>
                                                        <option value="50-150人">50-150人</option>
                                                        <option value="150-500人">150-500人</option>
                                                        <option value="500-1000人">500-1000人</option>
                                                        <option value="1000-5000人">1000-5000人</option>
                                                        <option value="5000-10000人">5000-10000人</option>
                                                        <option value="10000人以上">10000人以上</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-3">
                                                <div class="filter-group">
                                                    <label class="filter-label">统计指标</label>
                                                    <select id="metric" class="filter-select">
                                                        <option value="salary">平均薪资</option>
                                                        <option value="job_count">招聘岗位数</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="filter-group">
                                                    <label class="filter-label">省份</label>
                                                    <select id="province" class="filter-select">
                                                        <option value="">全国</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="filter-btn-group">
                                                    <button type="button" id="applyFilter" class="btn filter-btn filter-btn-primary mr-3">
                                                        <i class="fas fa-filter mr-1"></i> 应用筛选
                                                    </button>
                                                    <button type="button" id="resetFilter" class="btn filter-btn filter-btn-secondary mr-3">
                                                        <i class="fas fa-sync-alt mr-1"></i> 重置
                                                    </button>
                                                    <button type="button" id="exportData" class="btn filter-btn filter-btn-success">
                                                        <i class="fas fa-file-export mr-1"></i> 导出数据
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 地图热力图和排名 -->
                    <div class="row">
                        <!-- 地图热力图 -->
                        <div class="col-xl-8 col-lg-7">
                            <div class="card shadow mb-4">
                                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h6 class="m-0 font-weight-bold text-primary">薪资热力图</h6>
                                </div>
                                <div class="card-body">
                                    <div id="salaryMap" style="height: 600px; position: relative;">
                                        <div class="map-loading" id="map-loading">
                                            <i class="fas fa-spinner fa-spin fa-3x"></i>
                                            <p>地图数据加载中...</p>
                                        </div>
                                        <div class="map-error" id="map-error" style="display: none;">
                                            <i class="fas fa-exclamation-triangle fa-3x"></i>
                                            <p>地图加载失败，请刷新页面重试</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 排名表 -->
                        <div class="col-xl-4 col-lg-5">
                            <div class="card shadow mb-4">
                                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h6 class="m-0 font-weight-bold text-primary">排名 TOP 10</h6>
                                </div>
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="rank-table" id="rankTable">
                                            <thead>
                                                <tr>
                                                    <th>排名</th>
                                                    <th>地区</th>
                                                    <th id="rankMetric">平均薪资(元/月)</th>
                                                    <th>岗位数</th>
                                                </tr>
                                            </thead>
                                            <tbody id="rankTableBody">
                                                <!-- 排名数据将通过JavaScript动态填充 -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; 招聘数据可视化分析平台</span>
                    </div>
                </div>
            </footer>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">准备离开?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">如果您确定要退出，请点击下面的"退出"按钮。</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">取消</button>
                    <a class="btn btn-primary" href="login.html">退出</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="/static/vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="/static/js/sb-admin-2.min.js"></script>

    <!-- 薪资热力图脚本 -->
    <script src="/static/js/echarts/salary-map.js"></script>
    
    <!-- 初始化检查脚本 -->
    <script>
        $(document).ready(function() {
            // 检查ECharts是否正常加载
            if (typeof echarts === 'undefined') {
                $('#map-loading').hide();
                $('#map-error').show();
                console.error('ECharts未加载');
            }
        });
    </script>
</body>

</html>
